name: CI - AgriGest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Lint e testes do backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      # O backend usa o modulo nativo node:sqlite, que exige Node 22.5+
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxe do codigo
        run: npm run check

      # Shift-Left: o lint barato roda antes dos testes e do build da imagem
      - name: Lint com ESLint
        run: npm run lint

      - name: Rodar os testes automatizados
        run: npm test

  docker:
    name: Build e teste da imagem Docker
    runs-on: ubuntu-latest
    # So constroi a imagem se lint e testes passaram
    needs: backend

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Construir a imagem Docker
        run: docker build -t agrigest-api:${{ github.sha }} .

      - name: Subir o container e checar a saude da API
        run: |
          docker run -d -p 3001:3001 -e JWT_SECRET=segredo_do_ci --name agrigest agrigest-api:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3001/api/health; then exit 0; fi
            sleep 2
          done
          docker logs agrigest
          exit 1
